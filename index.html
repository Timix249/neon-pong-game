<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Pong – PC</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #eef5ff;
      background:
        radial-gradient(ellipse at 50% 0%, #173450, transparent 60%),
        #080d17;
      font-family: system-ui, sans-serif;
    }

    main { width: min(1050px, 96vw); text-align: center; }

    h1 {
      margin: 0 0 14px;
      color: #7affd0;
      letter-spacing: .15em;
      text-shadow: 0 0 20px #45ffc088;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #6b819b;
      border-radius: 16px;
      background: #0a1320;
      box-shadow: 0 20px 60px #0009, 0 0 35px #44d9c533;
      cursor: crosshair;
    }

    .arena { position: relative; }

    .start-menu {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 12px;
      border-radius: 16px;
      background: #07101de6;
    }

    .start-menu[hidden] { display: none; }
    .start-menu p { margin: 0; }
    .start-menu .buttons { justify-content: center; }
    #demoButton { background: #72c9ff; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button, select {
      border: 0;
      border-radius: 9px;
      padding: 10px 13px;
      font: inherit;
      font-weight: 800;
    }

    button {
      color: #07130f;
      background: #7affd0;
      cursor: pointer;
    }

    button:hover:not(:disabled) { filter: brightness(1.12); }
    button:disabled { opacity: .55; cursor: default; }
    select { color: #eef5ff; background: #24354a; cursor: pointer; }

    #autoButton { background: #ffd166; }
    #boostButton { background: #72c9ff; }
    #bigButton { background: #d3a4ff; }
    #shieldButton { background: #ff9eae; }
    #pauseButton { background: #b6c8df; }

    .status, .help {
      color: #c1cfe0;
      font-size: 14px;
    }

    .status { min-width: 190px; text-align: left; }
    .help { margin: 10px 0 0; }

    main:fullscreen {
      width: 100%;
      height: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #080d17;
    }

    main:fullscreen .arena { align-self: center; max-width: 100%; }

    main:fullscreen canvas {
      width: auto;
      height: min(75vh, 650px);
      max-width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 700px) {
      body { padding: 12px; }
      .toolbar { justify-content: center; }
      .status { text-align: center; }
      .buttons { justify-content: center; }
    }
  </style>
</head>
<body>
  <main id="gameShell">
    <h1>NEON PONG</h1>

    <div class="arena">
      <canvas id="game" width="960" height="560" aria-label="Neon Pong" tabindex="0"></canvas>
      <section class="start-menu" id="startMenu" aria-label="Spielmodus">
        <p>Wähle einen Spielmodus</p>
        <div class="buttons">
          <button id="playButton" type="button">Spielen</button>
          <button id="demoButton" type="button">Demo</button>
        </div>
      </section>
    </div>

    <div class="toolbar">
      <div id="status" class="status">Links: Auto · Rechts: Computer</div>

      <div class="buttons">
        <select id="difficulty" aria-label="Schwierigkeit">
          <option value="easy">Leicht</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Schwer</option>
        </select>
        <button id="autoButton" type="button">Auto: AN</button>
        <button id="boostButton" type="button">⚡ Zeitlupe</button>
        <button id="bigButton" type="button">↕ Großer Schläger</button>
        <button id="shieldButton" type="button">🛡 Schutz</button>
        <button id="pauseButton" type="button">Pause</button>
        <button id="fullscreenButton" type="button">Vollbild</button>
        <button id="restartButton" type="button">Neustart</button>
      </div>
    </div>

    <p class="help">
      Maus oder ↑ / ↓ bewegen · Leertaste: Pause · Q: Zeitlupe · E: großer Schläger · R: Schutz
    </p>
  </main>

  <script>
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const shell = document.querySelector("#gameShell");

    const startMenu = document.querySelector("#startMenu");
    const playButton = document.querySelector("#playButton");
    const demoButton = document.querySelector("#demoButton");

    const statusText = document.querySelector("#status");
    const difficulty = document.querySelector("#difficulty");
    const autoButton = document.querySelector("#autoButton");
    const boostButton = document.querySelector("#boostButton");
    const bigButton = document.querySelector("#bigButton");
    const shieldButton = document.querySelector("#shieldButton");
    const pauseButton = document.querySelector("#pauseButton");
    const fullscreenButton = document.querySelector("#fullscreenButton");
    const restartButton = document.querySelector("#restartButton");

    const W = canvas.width;
    const H = canvas.height;
    const BALL_R = 9;
    const PADDLE_W = 15;
    const PLAYER_NORMAL_H = 125;
    const PLAYER_BIG_H = 205;
    const CPU_H = 78;
    const WIN_SCORE = 5;

    const player = {
      x: 32, y: H / 2 - PLAYER_NORMAL_H / 2,
      w: PADDLE_W, h: PLAYER_NORMAL_H,
      score: 0, color: "#7affd0"
    };

    const cpu = {
      x: W - 32 - PADDLE_W, y: H / 2 - CPU_H / 2,
      w: PADDLE_W, h: CPU_H,
      score: 0, color: "#72c9ff"
    };

    const ball = { x: W / 2, y: H / 2, vx: 0, vy: 0 };
    const keys = { up: false, down: false };
    const particles = [];

    let autoPlay = true;
    let running = false;
    let paused = false;
    let message = "";
    let lastTime = 0;
    let serveTimer = 0;
    let serveDirection = 1;

    let slowTime = 0;
    let slowCooldown = 0;
    let bigTime = 0;
    let bigCooldown = 0;
    let shieldTime = 0;
    let notice = "";
    let noticeTime = 0;

    function startServe(direction) {
      ball.x = W / 2;
      ball.y = H / 2;
      ball.vx = 0;
      ball.vy = 0;
      serveDirection = direction;
      serveTimer = 0.75;
    }

    function startGame(automatic) {
      autoPlay = automatic;
      startMenu.hidden = true;
      resetGame();
      canvas.focus({ preventScroll: true });
    }

    function resetGame() {
      keys.up = keys.down = false;
      player.score = 0;
      cpu.score = 0;
      player.h = PLAYER_NORMAL_H;
      player.y = H / 2 - player.h / 2;
      cpu.y = H / 2 - cpu.h / 2;

      particles.length = 0;
      slowTime = slowCooldown = 0;
      bigTime = bigCooldown = shieldTime = 0;
      notice = message = "";
      running = true;
      paused = false;
      pauseButton.textContent = "Pause";

      startServe(Math.random() < 0.5 ? -1 : 1);
      updateButtons();
    }

    function clampPaddle(paddle) {
      paddle.y = Math.max(0, Math.min(H - paddle.h, paddle.y));
    }

    function takeManualControl() {
      if (autoPlay) {
        autoPlay = false;
        updateButtons();
      }
    }

    function activateSlow() {
      if (!running || paused || slowCooldown > 0) return;
      slowTime = 2.5;
      slowCooldown = 7;
      showNotice("ZEITLUPE!");
      burst(ball.x, ball.y, "#ffd166");
    }

    function activateBigPaddle() {
      if (!running || paused || bigCooldown > 0) return;
      bigTime = 5;
      bigCooldown = 10;
      player.h = PLAYER_BIG_H;
      clampPaddle(player);
      showNotice("GROSSER SCHLÄGER!");
      burst(player.x + player.w, player.y + player.h / 2, "#d3a4ff");
    }

    function activateShield() {
      if (!running || paused || shieldTime > 0) return;
      shieldTime = 8;
      showNotice("SCHUTZ AKTIV!");
      burst(player.x + player.w, player.y + player.h / 2, "#ff9eae");
    }

    function showNotice(text) {
      notice = text;
      noticeTime = 1.4;
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      pauseButton.textContent = paused ? "Weiter" : "Pause";
      updateButtons();
    }

    function update(dt) {
      if (!running || paused) return;

      const seconds = Math.min(dt / 1000, 0.04);

      // Spieler-Schläger: automatische oder manuelle Steuerung.
      if (autoPlay) {
        const target = ball.y - player.h / 2;
        const difference = target - player.y;
        const speed = ball.vx < 0 ? 520 : 300;
        player.y += Math.max(-speed * seconds, Math.min(speed * seconds, difference));
      } else {
        if (keys.up) player.y -= 430 * seconds;
        if (keys.down) player.y += 430 * seconds;
      }
      clampPaddle(player);

      // Computer rechts: Stärke über die Auswahl einstellbar.
      const level = difficulty.value;
      const cpuSpeed = level === "easy" ? 205 : level === "normal" ? 290 : 390;
      const missAmount = level === "easy" ? 34 : level === "normal" ? 20 : 8;
      const target = ball.y + Math.sin(performance.now() / 400) * missAmount - cpu.h / 2;
      const cpuDifference = target - cpu.y;
      cpu.y += Math.max(-cpuSpeed * seconds, Math.min(cpuSpeed * seconds, cpuDifference));
      clampPaddle(cpu);

      if (serveTimer > 0) {
        serveTimer -= seconds;
        if (serveTimer <= 0) {
          const angle = Math.random() * 0.6 - 0.3;
          const speed = 335;
          ball.vx = Math.cos(angle) * speed * serveDirection;
          ball.vy = Math.sin(angle) * speed;
        }
      } else {
        const speedFactor = slowTime > 0 ? 0.55 : 1;
        ball.x += ball.vx * seconds * speedFactor;
        ball.y += ball.vy * seconds * speedFactor;

        // Kollision mit oberer und unterer Wand.
        if (ball.y - BALL_R <= 0) {
          ball.y = BALL_R;
          ball.vy = Math.abs(ball.vy);
          burst(ball.x, ball.y, "#72c9ff");
        } else if (ball.y + BALL_R >= H) {
          ball.y = H - BALL_R;
          ball.vy = -Math.abs(ball.vy);
          burst(ball.x, ball.y, "#72c9ff");
        }

        checkPaddleCollision(player, 1);
        checkPaddleCollision(cpu, -1);

        // Schutzschild verhindert einen Punktverlust einmal pro Aktivierung.
        if (ball.x + BALL_R < 0) {
          if (shieldTime > 0) {
            shieldTime = 0;
            ball.x = BALL_R;
            ball.vx = Math.abs(ball.vx);
            showNotice("SCHUTZ HAT DICH GERETTET!");
            burst(ball.x, ball.y, "#ff9eae");
          } else {
            scorePoint(cpu, 1);
          }
        }

        if (ball.x - BALL_R > W) scorePoint(player, -1);
      }

      slowTime = Math.max(0, slowTime - seconds);
      slowCooldown = Math.max(0, slowCooldown - seconds);
      bigCooldown = Math.max(0, bigCooldown - seconds);
      shieldTime = Math.max(0, shieldTime - seconds);
      noticeTime = Math.max(0, noticeTime - seconds);

      if (bigTime > 0) {
        bigTime = Math.max(0, bigTime - seconds);
        if (bigTime === 0) {
          player.h = PLAYER_NORMAL_H;
          clampPaddle(player);
        }
      }

      updateParticles(seconds);
      updateButtons();
    }

    function checkPaddleCollision(paddle, direction) {
      const overlapsX =
        ball.x + BALL_R >= paddle.x &&
        ball.x - BALL_R <= paddle.x + paddle.w;
      const overlapsY =
        ball.y + BALL_R >= paddle.y &&
        ball.y - BALL_R <= paddle.y + paddle.h;
      const movingToward = direction > 0 ? ball.vx < 0 : ball.vx > 0;

      if (!overlapsX || !overlapsY || !movingToward) return;

      const offset = (ball.y - (paddle.y + paddle.h / 2)) / (paddle.h / 2);
      const speed = Math.min(Math.hypot(ball.vx, ball.vy) + 18, 540);
      const angle = offset * 0.82;

      ball.vx = direction * Math.cos(angle) * speed;
      ball.vy = Math.sin(angle) * speed;

      // Ball aus dem Schläger heraussetzen, damit er nicht darin hängen bleibt.
      ball.x = direction > 0
        ? paddle.x + paddle.w + BALL_R
        : paddle.x - BALL_R;

      burst(ball.x, ball.y, paddle.color);
    }

    function scorePoint(scorer, nextDirection) {
      if (!running) return;

      scorer.score++;
      burst(ball.x, ball.y, scorer.color);

      if (scorer.score >= WIN_SCORE) {
        running = false;
        message = scorer === player ? "DU HAST GEWONNEN!" : "COMPUTER GEWINNT!";
      } else {
        startServe(nextDirection);
      }
    }

    function burst(x, y, color) {
      for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 45 + Math.random() * 170;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          color
        });
      }
    }

    function updateParticles(seconds) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * seconds;
        p.y += p.vy * seconds;
        p.life -= 2.2 * seconds;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function updateButtons() {
      autoButton.disabled = !startMenu.hidden;
      pauseButton.disabled = !running;
      restartButton.disabled = !startMenu.hidden;
      autoButton.textContent = autoPlay ? "Auto: AN" : "Auto: AUS";
      statusText.textContent = !startMenu.hidden
        ? "Wähle einen Spielmodus"
        : autoPlay
          ? "Links: Auto · Rechts: Computer"
          : "Links: Du spielst · Rechts: Computer";

      boostButton.textContent = slowTime > 0
        ? `⚡ Zeitlupe ${slowTime.toFixed(1)}s`
        : slowCooldown > 0
          ? `⚡ Aufladen ${slowCooldown.toFixed(1)}s`
          : "⚡ Zeitlupe";

      bigButton.textContent = bigTime > 0
        ? `↕ Groß ${bigTime.toFixed(1)}s`
        : bigCooldown > 0
          ? `↕ Aufladen ${bigCooldown.toFixed(1)}s`
          : "↕ Großer Schläger";

      shieldButton.textContent = shieldTime > 0
        ? `🛡 Schutz ${shieldTime.toFixed(1)}s`
        : "🛡 Schutz";

      boostButton.disabled = !running || paused || slowCooldown > 0;
      bigButton.disabled = !running || paused || bigCooldown > 0;
      shieldButton.disabled = !running || paused || shieldTime > 0;
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#0a1320";
      ctx.fillRect(0, 0, W, H);

      // Mittellinie und dezentes Spielfeldraster.
      ctx.strokeStyle = "#72869b16";
      ctx.lineWidth = 1;
      for (let x = 20; x < W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }

      ctx.setLineDash([10, 13]);
      ctx.strokeStyle = "#73869b66";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(W / 2, 0);
      ctx.lineTo(W / 2, H);
      ctx.stroke();
      ctx.setLineDash([]);

      // Punktestand.
      ctx.textAlign = "center";
      ctx.font = "800 64px system-ui, sans-serif";
      ctx.fillStyle = player.color;
      ctx.fillText(player.score, W / 2 - 65, 75);
      ctx.fillStyle = cpu.color;
      ctx.fillText(cpu.score, W / 2 + 65, 75);

      drawPaddle(player);
      drawPaddle(cpu);
      drawBall();

      for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (shieldTime > 0) {
        ctx.strokeStyle = "#ff9eae";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(12, 0);
        ctx.lineTo(12, H);
        ctx.stroke();
      }

      if (noticeTime > 0) {
        ctx.globalAlpha = Math.min(1, noticeTime);
        ctx.fillStyle = "#fff";
        ctx.font = "800 24px system-ui, sans-serif";
        ctx.fillText(notice, W / 2, H - 24);
        ctx.globalAlpha = 1;
      }

      if (serveTimer > 0 && running && !paused) {
        ctx.fillStyle = "#c1cfe0";
        ctx.font = "600 18px system-ui, sans-serif";
        ctx.fillText("Gleich geht's los …", W / 2, H - 25);
      }

      if (paused || message) {
        ctx.fillStyle = "#07101ddd";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#fff";
        ctx.font = "800 40px system-ui, sans-serif";
        ctx.fillText(message || "PAUSE", W / 2, H / 2);
        ctx.fillStyle = "#c1cfe0";
        ctx.font = "18px system-ui, sans-serif";
        ctx.fillText(
          message ? "Klicke auf Neustart für eine neue Runde" : "Leertaste oder Weiter zum Fortsetzen",
          W / 2, H / 2 + 38
        );
      }
    }

    function drawPaddle(paddle) {
      ctx.save();
      ctx.shadowBlur = 20;
      ctx.shadowColor = paddle.color;
      ctx.fillStyle = paddle.color;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
      ctx.fill();
      ctx.restore();
    }

    function drawBall() {
      ctx.save();
      ctx.shadowBlur = slowTime > 0 ? 30 : 20;
      ctx.shadowColor = slowTime > 0 ? "#ffd166" : "#ffffff";
      ctx.fillStyle = slowTime > 0 ? "#ffd166" : "#ffffff";
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function frame(time) {
      const dt = lastTime ? Math.min(time - lastTime, 40) : 16.67;
      lastTime = time;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    canvas.addEventListener("pointermove", (event) => {
      if (paused || !running || autoPlay) return;
      const rect = canvas.getBoundingClientRect();
      const scaleY = H / rect.height;
      player.y = (event.clientY - rect.top) * scaleY - player.h / 2;
      clampPaddle(player);
    });

    window.addEventListener("keydown", (event) => {
      if (!startMenu.hidden || event.target.closest("button, select")) return;

      if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        takeManualControl();
        event.preventDefault();
        if (event.key === "ArrowUp") keys.up = true;
        if (event.key === "ArrowDown") keys.down = true;
      }

      if (event.code === "Space") {
        event.preventDefault();
        togglePause();
      }

      if (event.key.toLowerCase() === "q") activateSlow();
      if (event.key.toLowerCase() === "e") activateBigPaddle();
      if (event.key.toLowerCase() === "r") activateShield();
    });

    window.addEventListener("keyup", (event) => {
      if (event.key === "ArrowUp") keys.up = false;
      if (event.key === "ArrowDown") keys.down = false;
    });

    playButton.addEventListener("click", () => startGame(false));
    demoButton.addEventListener("click", () => startGame(true));

    autoButton.addEventListener("click", () => {
      autoPlay = !autoPlay;
      canvas.focus({ preventScroll: true });
      updateButtons();
    });

    boostButton.addEventListener("click", activateSlow);
    bigButton.addEventListener("click", activateBigPaddle);
    shieldButton.addEventListener("click", activateShield);
    pauseButton.addEventListener("click", togglePause);
    restartButton.addEventListener("click", () => {
      resetGame();
      canvas.focus({ preventScroll: true });
    });

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await shell.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch {
        fullscreenButton.textContent = "Vollbild nicht verfügbar";
      }
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenButton.textContent =
        document.fullscreenElement ? "Vollbild verlassen" : "Vollbild";
    });

    updateButtons();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
